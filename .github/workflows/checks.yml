name: checks

# Governing principle (from modelviewprojection): CI is a THIN WRAPPER over the
# make/Dockerfile system -- each job is `checkout` -> `make <target>`, and ALL
# check logic lives in the Makefile/Dockerfile + entrypoint/check-tools.sh, so
# CI and the container run IDENTICAL checks and can't drift.
#
# `make type-check` builds a LEAN toolchain image (WITH_TEXLIVE=0 -- no TeX Live,
# so it's fast: only the converter + gate deps install) and runs the gate (ruff +
# the local/global annotation checker + `ty` + pytest) inside it. Read-only: it
# touches no files and never commits.

on:
  push:
  pull_request:

jobs:
  type-check:
    name: converter tooling gate (ruff + annotations + ty + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make type-check
        working-directory: openstax/tooling
        run: make type-check
