# Release workflow: on a version-tag push, build every book and attach each
# book's PDF, EPUB and zipped HTML to a GitHub Release.
#
# CI is a thin wrapper over make (the modelviewprojection pattern): the book list
# comes from `make list-books`, and each book is built by `make <book>` — the same
# command you run locally, which writes output/<book>.pdf, output/<book>.epub and
# output/<book>-html.zip (the zipped web edition).
# Only the GitHub-specific parts live here: the per-book matrix, passing files
# between jobs, and creating the Release.
#
# One job per book folder, so each gets its own 6-hour job limit and its own disk
# (the TeX Live image plus one bundle's output), and they run in parallel.
# A Release asset must be < 2 GiB; the largest book file (biology-2e.epub) is
# ~400 MB. The browsable HTML site is not deployed here: `make publish-pages`
# (run by hand on the host) pushes it to the gh-pages branch; each book's first
# page links the assets this workflow attaches (releases/latest/download/...).
#
# Cut a release:  git tag v2026.11.0 && git push github v2026.11.0
name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      books: ${{ steps.books.outputs.books }}
    steps:
      - uses: actions/checkout@v5
      - id: books
        run: echo "books=$(make -s list-books | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  book:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one broken book must not cancel the others
      matrix:
        book: ${{ fromJSON(needs.list.outputs.books) }}
    steps:
      - uses: actions/checkout@v5

      # The runner image ships ~30 GB of SDKs this build never uses; the Fedora +
      # TeX Live image and a bundle's output need the room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build ${{ matrix.book }}
        run: make ${{ matrix.book }}

      - name: Show the build log on failure
        if: failure()
        run: tail -100 output/logs/*.log

      - uses: actions/upload-artifact@v4
        with:
          name: book-${{ matrix.book }}
          path: |
            output/*.pdf
            output/*.epub
            output/*-html.zip
          if-no-files-found: error
          retention-days: 1   # only a handoff to the release job; the Release keeps the files

  # Runs even when some books failed, so the Release carries every book that
  # built; a failed book shows as a red matrix job in the run. Skipped only if
  # the run was cancelled or the book list itself could not be produced.
  release:
    needs: [list, book]
    if: ${{ !cancelled() && needs.list.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write         # create the Release and upload its assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: book-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pdf
            dist/*.epub
            dist/*-html.zip
